<!DOCTYPE html>
<html xmlns:th="www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="ISO-8859-1">
<title>Insert title here</title>
</head>
<body>

	<section>
		<div class="container-fluid mt-5 p-5">
			<div class="row">

				<div class="col-md-3 ">
					<div class="card card-sh">
						<div class="card-header text-center fs-4">
							Add Category

							<th:block th:if="${session.successMsg}">
								<p class="text-success fw-bold">[[${session.successMsg}]]</p>
								<th:block
									th:text="${@commonServiceImpl.removeMessageFromSession()}"></th:block>
							</th:block>

							<th:block th:if="${session.errorMsg}">
								<p class="text-danger fw-bold">[[${session.errorMsg}]]</p>
								<th:block
									th:text="${@commonServiceImpl.removeMessageFromSession()}"></th:block>
							</th:block>

						</div>
						<div class="card-body">
							<form action="/admin/saveCategory" method="POST"
								enctype="multipart/form-data">
								<div class="mb-3">
									<label>Enter Category</label> <input class="form-control"
										name="cateName" type="text">
								</div>

								<div class="mb-3">
									<label>Status</label>

									<div class="form-check">
										<input class="form-check-input" type="radio" name="isActive"
											id="radioDefault1" checked value="true"> <label
											class="form-check-label" for="radioDefault1"> Active
										</label>
									</div>
									<div class="form-check">
										<input class="form-check-input" type="radio" name="isActive"
											id="radioDefault2" value="false"> <label
											class="form-check-label" for="radioDefault2">
											Inactive </label>
									</div>
								</div>

								<div class="mb-3">
									<label>Upload Image</label> <input class="form-control"
										name="file" type="file">
								</div>

								<button class="btn btn-primary col-md-12">Add</button>
							</form>

						</div>

					</div>
				</div>

				<div class="col-md-9">
					<div class="card card-sh">
						<div class="card-header text-center fs-4">Category Details</div>

						<div class="card-body">
							<table class="table">
								<thead>
									<tr>
										<th scope="col">S.no</th>
										<th scope="col">Category</th>
										<th scope="col">Image</th>
										<th scope="col">Status</th>
										<th scope="col">Action</th>
									</tr>
								</thead>

								<tbody>
									<tr th:each="cat,c :${categorys}">
										<th scope="row" th:text="${c.count}"></th>
										<td th:text="${cat.cateName}"></td>
										<td><img
											th:src="@{'/img/category_img/' + ${cat.imageName}}"
											width="50px" height="50px" /></td>
										<td th:text="${cat.isActive}"></td>
										<td><a
											th:href="@{'/admin/loadEditCategory/' + ${cat.id}}"
											class="btn btn-primary btn-sm"> <i
												class="fa-regular fa-pen-to-square"></i> Edit
										</a> <a th:href="@{'/admin/deletePC/' + ${cat.id}}"
											class="btn btn-danger btn-sm"> <i
												class="fa-solid fa-trash"></i> Delete
										</a></td>
									</tr>
								</tbody>
							</table>
							<!-- Stating Pagination -->

							<div class="row">
								<div class="col-md-4">Total Page : [[${totalElements}]]</div>
								<div class="col-md-6">
									
										<nav aria-label="Page navigation example">
											<ul class="pagination">

												<li class="page-item"><a class="page-link"
													th:classappend="${isFirst} ? 'disabled' : ' ' "
													th:href="@{'/admin/category?pageNo='+${pageNo-1}}">Previous</a></li>

												<li th:each="i:${#numbers.sequence(1,totalPages)}"
													class="page-item"
													th:classappend="${pageNo+1==i}?'active':' ' "><a
													class="page-link" th:href="@{'/admin/category?pageNo=' + ${i-1}}">[[${i}]]</a></li>


												<li class="page-item"><a
													th:classappend="${isLast} ? 'disabled' : ' ' "
													th:href="@{'/admin/category?pageNo='+${pageNo+1}}"
													class="page-link">Next</a></li>
											</ul>
										</nav>
									
								</div>
							</div>

							<!-- End Pagination  -->


						</div>

					</div>
				</div>

			</div>
		</div>
	</section>

</body>
</html>
