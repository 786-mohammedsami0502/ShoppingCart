<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace ="base::layout(~{::section})" >
<head>
<meta charset="ISO-8859-1">
<title>Insert title here</title>
</head>
<body>
<section>
	<div class="container p-5 ">
		<p class="text-center fs-3 mt-4 "> Admin Dashboard </p>
		<div class="row p-5">
			<div class="col-md-4 mt-2">
				<a href="/admin/load_add_product" class="text-decoration-none">
					<div class="card card-sh text-primary">
						<div class="card-body text-center">
						<i class="fa-solid fa-square-plus fa-2x "></i>
						<h4> Add Product </h4>
						</div>
					</div>
				</a>
			</div>
			
			<div class="col-md-4 mt-2">
				<a href="/admin/category" class="text-decoration-none">
					<div class="card card-sh text-warning">
						<div class="card-body text-center">
						<i class="fa-solid fa-right-to-bracket fa-2x"></i>
						<h4> Add Category </h4>
						</div>
					</div>
				</a>
			</div>
			
			<div class="col-md-4 mt-2">
				<a href="/admin/view_product" class="text-decoration-none">
					<div class="card card-sh text-success">
						<div class="card-body text-center">
						<i class="fa-solid fa-table-list fa-2x"></i>
						<h4> view Product </h4>
						</div>
					</div>
				</a>
			</div>
			
			<div class="col-md-4 mt-4">
				<a href="/admin/orders" class="text-decoration-none">
					<div class="card card-sh text-warning">
						<div class="card-body text-center">
						<i class="fa-solid fa-boxes-stacked fa-2x"></i>
						<h4> Orders </h4>
						</div>
					</div>
				</a>
			</div>
			
			<div class="col-md-4 mt-4">
				<a href="/admin/users" class="text-decoration-none">
					<div class="card card-sh text-primary">
						<div class="card-body text-center">
						<i class="fa-solid fa-circle-user fa-2x"></i>
						<h4> Users </h4>
						</div>
					</div>
				</a>
			</div>
			
			<div class="col-md-4 mt-4">
				<a href="/admin/show-admin" class="text-decoration-none">
					<div class="card card-sh text-danger">
						<div class="card-body text-center">
						<i class="fa-solid fa-user-plus fa-2x"></i>
						<h4> Edit Admin </h4>
						</div>
					</div>
				</a>
			</div>
		</div>
		
	</div>
</section>
</body>
</html>
