<!DOCTYPE html>
<html xmlns:th="www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="ISO-8859-1">
<title>Insert title here</title>
</head>
<body>

<section>
		<div class="container-fluid mt-5 p-5">
			<div class="row">
		
				<div class="col-md-3 offset-md-5 ">
					<div class="card card-sh">
						<div class="card-header text-center fs-4">Edit Category
						
						<th:block th:if="${session.successMsg}">
						<p class="text-success fw-bold">[[${session.successMsg}]]</p>
						<th:block th:text="${@commonServiceImpl.removeMessageFromSession()}"></th:block>
						</th:block>
						
						<th:block th:if="${session.errorMsg}">
						<p class="text-danger fw-bold">[[${session.errorMsg}]]</p>
						<th:block th:text="${@commonServiceImpl.removeMessageFromSession()}"></th:block>
						</th:block>
						
						</div>
							<div class="card-body">
								<form action="/admin/updateCategory" method="POST" enctype="multipart/form-data">
								<input type="hidden"  name=id th:value="${categoryById.id}">	
									<div class="mb-3">
										<label>Enter Category</label>
										<input class="form-control" name="cateName" type="text" 
										th:value="${categoryById.cateName}">
									</div>
									
									<div class="mb-3">
										<label>Status</label>
										
										<div class="form-check">
											  <input class="form-check-input" type="radio" 
											  name="isActive" id="radioDefault1"
											  th:checked="${categoryById.isActive==true}" value="true">
											  <label class="form-check-label" for="radioDefault1">
											    Active
											  </label>
											</div>
											<div class="form-check">
											  <input class="form-check-input" type="radio"
											  name="isActive" id="radioDefault2" 
											  th:checked="${categoryById.isActive==false}" value="false">
											  <label class="form-check-label" for="radioDefault2">
											    Inactive
											  </label>
											</div>
										</div>
									
									<div class="mb-3">
										<label>Upload Image</label><br/>
										<img th:src="@{'/img/category_img/' + ${categoryById.imageName}}" 
										width=100px height=100px>
										<input class="form-control" name="file" type="file">
									</div>
									
									<button class="btn btn-primary col-md-12"> Add </button>
									<a class="btn btn-primary col-md-12 mt-2"
									th:href="@{'/admin/category'}">Back</a>
									
															
								</form>
								
							</div>
								
					</div>
				</div>
							
			
			</div>
		</div>
	</section>

</body>
</html>
