<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
	th:fragment="layout(content)">
<head>
<meta charset="ISO-8859-1">
<title>Insert title here</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
	crossorigin="anonymous">

<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
	integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
	crossorigin="anonymous" referrerpolicy="no-referrer" />

<link rel="stylesheet" href="/css/style.css">

</head>
<body>

	<!-- Starting Navbar  -->

	<nav class="navbar navbar-expand-lg bg-primary fixed-top navbar-dark">
		<div class="container-fluid">
			<a class="navbar-brand" href="#"> <i
				class="fa-solid fa-cart-shopping"></i> E-com Store
			</a>
			<button class="navbar-toggler" type="button"
				data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
				aria-controls="navbarSupportedContent" aria-expanded="false"
				aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarSupportedContent">
				<ul class="navbar-nav me-auto mb-2 mb-lg-0">
					<li class="nav-item"><a class="nav-link active"
						aria-current="page" href="/"> <i
							class="fa-solid fa-house-chimney"></i> Home
					</a></li>
					<li class="nav-item"><a class="nav-link" href="/product">Products</a>
					</li>
					<li class="nav-item dropdown"><a
						class="nav-link dropdown-toggle" href="#" role="button"
						data-bs-toggle="dropdown" aria-expanded="false"> Category </a>
						<ul class="dropdown-menu">
							<li th:each="c:${activeCategory}"><a class="dropdown-item"
								th:href="'/product?category='+${c.cateName}">[[${c.cateName}]]</a></li>

						</ul></li>
				</ul>

				<ul class="navbar-nav  mb-2 mb-lg-0">
					<th:block th:if=${user==null}>

						<li class="nav-item"><a class="nav-link active"
							aria-current="page" href="/login"> <i
								class="fa-solid fa-arrow-right-to-bracket"></i> Login
						</a></li>
						<li class="nav-item"><a class="nav-link active"
							aria-current="page" href="/signup"> <i
								class="fa-regular fa-user"></i> Register
						</a></li>
						<!-- <li class="nav-item"><a class="nav-link active"
							aria-current="page" href="/admin/admin"> <i
								class="fa-regular fa-user"></i> Admin
						</a></li> -->

					</th:block>

					<th:block th:if=${user!=null}>
						<th:block th:if="${user.role == 'ROLE_USER'}">
							<li class="nav-item"><a class="nav-link active"
								aria-current="page" href="/user/cart"> <i
									class="fa-solid fa-basket-shopping"></i> Cart [
									[[${countCart}]] ]
							</a></li>
						</th:block>
						<li class="nav-item dropdown"><a
							class="nav-link dropdown-toggle active" href="#" role="button"
							data-bs-toggle="dropdown" aria-expanded="false"> <i
								class="fa-regular fa-user"></i> [[${user.name}]]
						</a>
							<ul class="dropdown-menu">
								<th:block th:if="${user.role == 'ROLE_USER'}">
									<li><a class="dropdown-item" href="/user/profile">Profile</a></li>
									<li><a class="dropdown-item" href="/user/my_orders">My
											Orders</a></li>

								</th:block>
								<th:block th:unless="${user.role == 'ROLE_USER'}">
									<li><a class="dropdown-item" href="/admin/admin">Profile
									</a></li>
								</th:block>
								<li><hr class="dropdown-divider"></li>
								<li><a class="dropdown-item" href="/logout"> <i
										class="fa-solid fa-arrow-right-to-bracket"> Logout</i>
								</a></li>
							</ul></li>

						<!-- <li class="nav-item"><a class="nav-link active"
							aria-current="page" href="/logout"> <i
								class="fa-solid fa-arrow-right-to-bracket"></i> Logout
						</a></li> -->

					</th:block>
				</ul>

			</div>
		</div>
	</nav>

	<!-- End Navbar -->

	<div th:replace="${content}"></div>



	<!-- Start Footer -->

	<div class="container-fluid p-1 bg-primary text-center text-white">
		<!-- style="margin-top: 250px" -->
		<p>ecom.com</p>
	</div>

	<!-- End Footer -->


	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>

</body>
</html>
