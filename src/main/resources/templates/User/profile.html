<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="base::layout(~{::section})">
<head>
<meta charset="ISO-8859-1">
<title>Insert title here</title>
</head>
<body>
	<section>
		<div class="container mt-5 p-5 ">
			<div class="row">
				<div class="col-md-10 offset-md-1 ">

					<p class="text-center fs-3">My Profile</p>
					<div>
						<th:block th:if=${session.successMsg}>
							<p class="text-center text-success" th:text=${session.successMsg}></p>
							<th:block
								th:text="${@commonServiceImpl.removeMessageFromSession()}"></th:block>
						</th:block>
						</th:block>
						<th:block th:if=${session.errorMsg}>
							<p class="text-center text-danger" th:text=${session.errorMsg}></p>
							<th:block
								th:text="${@commonServiceImpl.removeMessageFromSession()}"></th:block>
						</th:block>
						</th:block>

					</div>
					<hr>
					<div class="text-center">
						<img alt="" th:src="@{'../img/profile_img/' +${user.image}}"
							class="border p-2"
							style="width: 150px; height =150px; border-radius: 50%">
					</div>
					<div class="col-md-8 offset-md-3">
						<form action="/user/update-profile" method="post"
							enctype="multipart/form-data">
							<table class="table table-borderless">
								<tbody>
									<tr>
										<th scope="row">Name</th>
										<td>:</td>
										<td><input type="text" name="name" class="form-control"
											th:value="${user.name}"></td>
									</tr>

									<tr>
										<th scope="row">Number</th>
										<td>:</td>
										<td><input type="text" name="number" class="form-control"
											th:value="${user.number}"></td>
									</tr>

									<tr>
										<th scope="row">Email</th>
										<td>:</td>
										<td><input type="text" name="" class="form-control"
											th:value="${user.email}" readonly="readonly"></td>
									</tr>

									<tr>
										<th scope="row">Address</th>
										<td>:</td>
										<td><input type="text" name="address"
											class="form-control" th:value="${user.address}"></td>
									</tr>

									<tr>
										<th scope="row">City</th>
										<td>:</td>
										<td><input type="text" name="city" class="form-control"
											th:value="${user.city}"></td>
									</tr>

									<tr>
										<th scope="row">State</th>
										<td>:</td>
										<td><input type="text" name="state" class="form-control"
											th:value="${user.state}"></td>
									</tr>

									<tr>
										<th scope="row">Pincode</th>
										<td>:</td>
										<td><input type="text" name="pincode"
											class="form-control" th:value="${user.pincode}"></td>
									</tr>

									<tr>
										<th scope="row">Image</th>
										<td>:</td>
										<td><input type="file" name="file" class="form-control"
											value=""></td>
									</tr>
									<tr>
										<th scope="row">Role</th>
										<td>:</td>
										<td><input type="text" name="role" class="form-control"
											th:value="${user.role}"></td>
									</tr>

									<tr>
										<th scope="row">Account Status</th>
										<td>:</td>
										<td><input type="text" name="isEnabled"
											class="form-control" th:value="${user.isEnabled}"
											readonly="readonly"></td>
									</tr>

									<tr>
										<td><input type="hidden" th:value="${user.id}" name=id></td>
										<td class="text-center">
											<button class="btn  btn-primary">Update</button>
										</td>

									</tr>
								</tbody>

							</table>
						</form>
					</div>
				</div>
				<hr>
				<div class="col-md-10 offset-md-1 mt-1">
					<div class="row">
						<p class="text-center fs-3">Change Password</p>
						<div class="col-md-6 offset-md-3">
							<form action="/user/change-password" method="post">
								<table class="table table-borderless">
									
									<tbody>
										<tr>
											<th scope="row">Current Password</th>
											<td><input type="text" name="currentPassword" class="form-control"></td>
										</tr>

										<tr>
											<th scope="row">New Password</th>
											<td><input type="text" name="newPassword" class="form-control"></td>
										</tr>
										<tr>
											<th scope="row">Confirm Password</th>
											<td><input type="text" name="confirmPassword" class="form-control"></td>
										</tr>
										<tr>
											<td></td>
											<td class="text-center">
												<button class="btn  btn-primary">Update</button>
											</td>

										</tr>
									</tbody>
								</table>
							</form>
						</div>
					</div>
				</div>

			</div>
		</div>

	</section>
</body>
</html>
