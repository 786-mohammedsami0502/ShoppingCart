<!DOCTYPE html>
<html xmlns:th="www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<meta charset="ISO-8859-1">
<title th:value="${title}"></title>
</head>
<body>

	<section>
		<div class="container mt-5 ">
			<div class="card card-sh">
				<div class="card-header text-center fs-4">
					<p>Cart</p>
					<th:block th:if=${session.successMsg}>
						<p class="text-center text-success" th:text=${session.successMsg}></p>
						<th:block
							th:text="${@commonServiceImpl.removeMessageFromSession()}"></th:block>
					</th:block>
				</div>

				<div class="card-body">
					<div class="card-body">
						<table class="table">
							<thead>
								<tr>
									<th scope="col">S.no</th>
									<th scope="col">Image</th>
									<th scope="col">Product Name</th>
									<th scope="col">Price</th>
									<th scope="col">Discount [%]</th>
									<th scope="col">Quantity</th>
									<th scope="col">Total Price</th>
								</tr>
							</thead>

							<tbody>
								<tr th:each="cart,c:${carts}">
									<th scope="row" th:text=${c.count}></th>

									<td><img
										th:src="@{'/img/product_img/' + ${cart.product.prodImage}}"
										width=50px height="50px"></td>

									<td th:text=${cart.product.title}></td>
									<td th:text=${cart.product.price}></td>
									<td th:text=${cart.product.discount}></td>
									<td><a
										th:href="@{'/user/cartQuantityUpdate?sy=de&cid=' + ${cart.id}}">
											<i class="fa-solid fa-minus"></i>
									</a> [ [[${cart.quantity}]] ] <a
										th:href="@{'/user/cartQuantityUpdate?sy=in&cid=' + ${cart.id}}">
											<i class="fa-solid fa-plus"></i>
									</a></td>
									<td th:text=${cart.totalPrice}></td>

								</tr>
								<tr>
									<td colspan="5"></td>
									<td class="fw-bold">Total Price</td>
									<td class="fw-bold ">&#8377; [[${totalOrderPrice}]]</td>
								</tr>
							</tbody>
						</table>
						
						<div class="text-center">
							<a href="/user/order" class="btn btn-warning" > Proceed Payment </a> 
						</div>
						
					</div>
				</div>
			</div>
		</div>
	</section>

</body>
</html>
