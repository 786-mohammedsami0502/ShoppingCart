<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
	th:replace="base::layout(~{::section})">
<head>
<meta charset="ISO-8859-1">
<title>Insert title here</title>
</head>
<body>

	<section>
		<div class="container mt-5 p-5">
			<form action="/user/saveOrder" method="POST">
				<div class="row">

					<div class="col-md-6 mt-3 p-2">
						<div class="card shadow-sm p-3 mb-5 bg-body-tertiary rounded">

							<div class="card-header">
								<p class="fs-4 text-center">Payment Type</p>
								<br>
								<div class="card">
									<div class="card-body">
										<table class="table table-borderless">
											<tbody>
												<tr>
													<td>Total Price</td>
													<td>:</td>
													<td>&#8377; [[${totalOrderPrice}]]</td>
												</tr>
												<tr>
													<td>Delivery Charges</td>
													<td>:</td>
													<td>&#8377; [[${deliveryCharge}]]</td>
												</tr>
												<tr>
													<td>Tax ( 18 % )</td>
													<td>:</td>
													<td> [[${tax}]] </td>
												</tr>
												<tr class="border-top">
													<td>Total Price</td>
													<td>:</td>
													<td>&#8377; [[${calc}]]</td>
												</tr>
											</tbody>
										</table>
									</div>
								</div>
							</div>

							<div class="card-body ">
								<!-- <form action="/login" method="POST"> -->
								<div class="mb-3">
									<label class="form-label">Select Payment Type</label> <select
										name="paymentType" class="form-control">
										<option>--Select--</option>
										<option value="COD">Cash On Delivery</option>
										<option value="ONLINE">Online Payment</option>
									</select>
								</div>

								<button class="btn bg-primary text-white col-md-12">Place
									Order</button>
								<!-- </form> -->
							</div>

						</div>
					</div>

					<div class="col-md-6 mt-3 p-2">
						<div class="card shadow-sm p-3 mb-5 bg-body-tertiary rounded">

							<div class="card-header">
								<p class="fs-4 text-center">Billing Address</p>

								<th:block th:if="${session.successMsg}">
									<p class="text-success fw-bold">[[${session.successMsg}]]</p>
									<th:block
										th:text="${@commonServiceImpl.removeMessageFromSession()}"></th:block>
								</th:block>

								<th:block th:if="${session.errorMsg}">
									<p class="text-danger fw-bold">[[${session.errorMsg}]]</p>
									<th:block
										th:text="${@commonServiceImpl.removeMessageFromSession()}"></th:block>
								</th:block>

							</div>

						<div class="card-body" th:each=u:${user}>

								<div class="row" >
									<div class=" col mb-3">
										<label class="form-label">Name</label> <input
											class="form-control" name="name" type="text"
											th:value="${u.name}" required>
									</div>

									<div class=" col mb-3">
										<label class="form-label">Mobile Number</label> <input
											class="form-control" name="number" type="number"
											th:value="${u.number}" required>
									</div>
								</div>

								<div class=" col mb-3">
									<label class="form-label">Email</label> <input
										class="form-control" name="email" th:value="${u.email}" type="email"
										 required>
								</div>

								<div class="row">
									<div class=" col mb-3">
										<label class="form-label">Address</label> <input
											class="form-control" name="address" type="text"
											th:value="${u.address}" required>
									</div>

									<div class=" col mb-3">
										<label class="form-label">City</label> <input
											class="form-control" name="city" type="text"
											th:value="${u.city}" required>
									</div>
								</div>

								<div class="row">
									<div class=" col mb-3">
										<label class="form-label">State</label> <input
											class="form-control" name="state" type="text"
											th:value="${u.state}" required>
									</div>

									<div class=" col mb-3">
										<label class="form-label">Pincode</label> <input
											class="form-control" name="pincode" type="number"
											th:value="${u.pincode}" required>
									</div>
								</div>
							</div>


						</div>
					</div>
				</div>
			</form>
		</div>

	</section>



</body>
</html>
