<!DOCTYPE html>
<html xmlns:th="www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<meta charset="ISO-8859-1">
<title th:value="${title}"></title>
</head>
<body>

	<section>
		<div class="container mt-5 p-5">
			<div class="card card-sh">
				<div class="card-header text-center fs-4">
					<p>My Orders</p>
					<th:block th:if=${session.successMsg}>
						<p class="text-center text-success fw-bold"
							th:text=${session.successMsg}></p>
						<th:block
							th:text="${@commonServiceImpl.removeMessageFromSession()}"></th:block>
					</th:block>
					<th:block th:if=${session.errorMsg}>
						<p class="text-center text-success fw-bold"
							th:text=${session.errorMsg}></p>
						<th:block
							th:text="${@commonServiceImpl.removeMessageFromSession()}"></th:block>
					</th:block>
				</div>

				<div class="card-body">
					<div class="card-body">
						<table class="table table-border">
							<thead>
								<tr>
									<th scope="col">Order Id</th>
									<th scope="col">Date</th>
									<th scope="col">Product Details</th>
									<th scope="col">Quantity</th>
									<th scope="col">Price</th>
									<th scope="col">Status</th>
									<th scope="col">Action</th>
								</tr>
							</thead>

							<tbody>
								<tr th:each="o:${orders}">

									<td scope="row" th:text=${o.orderId}></td>
									<td th:text=${o.orderDate}></td>
									<td>[[${o.product.title}]]</td>
									<td th:text=${o.quantity}></td>
									<td>Quantity : [[${o.quantity}]] <br> Price :
										[[${o.price}]] <br> Total Price : [[${o.quantity *
										o.price}]]
									</td>
									<td>[[${o.orderStatus}]]</td>
									<td>
										<th:block th:if="${o.orderStatus != 'Cancelled' }">
											<a th:href="@{'/user/update-status?id='+${o.id}+'&st=6'}"
												class="btn btn-sm btn-danger">Cancel</a>
										</th:block>
										
										<th:block th:unless="${o.orderStatus != 'Cancelled' }">
											<a th:href="@{'/user/update-status?id='+${o.id}+'&st=6'}"
												class="btn btn-sm btn-danger disabled ">Cancel</a>
										</th:block>
									</td>
								</tr>

							</tbody>
						</table>

					</div>
				</div>
			</div>
		</div>
	</section>

</body>
</html>
