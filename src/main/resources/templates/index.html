<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="ISO-8859-1">
<title>Insert title here</title>
</head>
<body>
	<section>
		<!-- Start Slider -->
		<div class="mt-5">
			<div id="carouselExampleAutoplaying" class="carousel slide"
				data-bs-ride="carousel">
				<div class="carousel-inner">
					<div class="carousel-item active">
						<img src="img/Home/ecom1.png" class="d-block w-100" height="350px"
							alt="...">
					</div>
					<div class="carousel-item">
						<img src="img/Home/ecom4.jpg" class="d-block w-100" height="350px"
							alt="...">
					</div>
					<div class="carousel-item">
						<img src="img/Home/ecom3.jpg" class="d-block w-100" height="350px"
							alt="...">
					</div>
				</div>
				<button class="carousel-control-prev" type="button"
					data-bs-target="#carouselExampleAutoplaying" data-bs-slide="prev">
					<span class="carousel-control-prev-icon" aria-hidden="true"></span>
					<span class="visually-hidden">Previous</span>
				</button>
				<button class="carousel-control-next" type="button"
					data-bs-target="#carouselExampleAutoplaying" data-bs-slide="next">
					<span class="carousel-control-next-icon" aria-hidden="true"></span>
					<span class="visually-hidden">Next</span>
				</button>
			</div>
		</div>

		<!-- End Slider -->

		<!-- Start Category Model -->

		<div class="container">
			<div class="row">
				<p class="text-center fs-3">Category</p>

				<div class="col-md-2" th:each="c:${category}">
					<div
						class="card rounded-circle shadow-sm p-3 mb-5 bg-body-tertiary rounded">
						<div class="card-body text-center ">
							<img th:src="@{'/img/category_img/'+ ${c.imageName}}" width="65%"
								height="170px">
							<P>[[${c.cateName}]]</P>
						</div>
					</div>
				</div>

				<!-- <div class="col-md-2">				
				<div class="card rounded-circle shadow-sm p-3 mb-5 bg-body-tertiary rounded">
					<div class="card-body text-center ">
					<img src="img/category_img/pant.png" width="65%" height="170px">
					<P>Clothes</P>					
					</div>
				</div>
			</div> -->

			</div>
		</div>


		<!-- End Category Model -->

		<!-- Start Latest Product Model -->

		<div class="container">
			<div class="row">
				<p class="text-center fs-3">Latest Product</p>

				<div class="col-md-3" th:each="p:${products}">
					<div class="card shadow-sm p-3 mb-5 bg-body-tertiary rounded ">
						<div class="card-body text-center">
							<img th:src="@{'/img/product_img/' + ${p.prodImage}}" width="65%"
								height="140px">
								
							<P class="mt-1">[[${p.title}]]</P>
						</div>
					</div>
				</div>

				<!-- <div class="col-md-3">
				<div class="card shadow-sm p-3 mb-5 bg-body-tertiary rounded ">
					<div class="card-body text-center">
					<img src="img/latest_img/l4.jfif" width="65%" height="140px">
					<P class="mt-1">SHOE</P>					
					</div>
				</div>
			</div> -->

			</div>
		</div>


	</section>
</body>
</html>
